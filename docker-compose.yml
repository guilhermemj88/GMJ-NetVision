services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netvision
      POSTGRES_USER: netvision
      POSTGRES_PASSWORD: netvision
    ports:
      - '5432:5432'
    volumes:
      - netvision-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netvision']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  netvision-data:
