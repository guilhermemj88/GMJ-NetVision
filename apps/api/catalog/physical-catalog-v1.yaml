implementationNotes:
- Port group physicalLabelPattern is a compact declaration. Importer/bootstrap may expand it into individual PhysicalTemplatePort
  rows.
- Patterns containing {n+5} are semantic offset patterns; importer should expand to the actual ordinals instead of treating
  them literally.
- Do not hardcode Huawei stack/member numbering into template connector identity. Keep a stable physical connector identity
  and let the Huawei driver map CLI names.
- Desktop/non-rack devices may use a 1U logical footprint in the current rack UI, but rackMount=false must be preserved.
- Do not silently change vendorVerified=false to true without an official source and a reviewed change to this catalog.
