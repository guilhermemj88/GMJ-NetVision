schemaVersion: '1.0'
catalogKey: gmj-netvision-physical-catalog-v1.1
generatedFor: GMJ NetVision
purpose: Source of truth for SYSTEM physical/DCIM templates. V1.1 verification sweep adds official Huawei and MikroTik chassis/connector facts
  while keeping unverified placeholders conservative.
policies:
  systemCatalogIdempotent: true
  customTemplatesNeverOverwritten: true
  vendorVerifiedMeaning: Exact model/SKU plus encoded physical connector/slot facts have an official manufacturer source in sources[]. Entries
    may still have intentionally deferred module/card details.
  unverifiedPolicy: Keep the template as a model/family placeholder, but do not invent ports, slots, heights, cards, or connector types. Unknown
    physical interfaces are not auto-created on vendor templates.
  physicalPortDefinition: A real chassis/board connector. VLANIF, loopback, LAG, tunnel, bridge, subinterface, pseudowire, PPPoE, virtual/template
    interfaces are logical and must not become PhysicalPort.
  breakoutPolicy: A QSFP/QSFP28/QSFP56/QSFP-DD cage remains one physical connector. Breakout lanes are logical children and never extra chassis
    connectors.
  templateSyncPolicy: On vendor templates, interface sync maps Device.Interface to existing template ports; it does not add unmatched logical/unknown
    ports. On generic/discovered templates, only PHYSICAL-classified interfaces may create ports.
  modulePolicy: Modular chassis expose slots. Service connectors appear only when a verified/manual module is installed. Failed discovery must
    never remove manual modules.
interfaceClassification:
  resultValues:
  - PHYSICAL
  - LOGICAL
  - UNKNOWN
  globalLogicalPatterns:
  - '*.* (subinterface/unit)'
  - LoopBack*
  - Loopback*
  - Vlanif*
  - Eth-Trunk*
  - Tunnel*
  - NULL*
  - Virtual-Ethernet*
  - Virtual-Template*
  - Bridge*
  - VBDIF*
  - Dialer*
  - Nve*
  vendorRules:
    Huawei:
      physicalCandidates:
      - GigabitEthernet*
      - XGigabitEthernet*
      - 10GE*
      - 25GE*
      - 40GE*
      - 50GE*
      - 100GE*
      - 200GE*
      - 400GE*
      - MEth*
      logical:
      - Vlanif*
      - LoopBack*
      - Eth-Trunk*
      - Tunnel*
      - Virtual-Ethernet*
      - Virtual-Template*
      - VBDIF*
      - '*.*'
    MikroTik:
      physicalCandidates:
      - ether*
      - sfp*
      - sfp-sfpplus*
      - sfp28-*
      - qsfp*
      logical:
      - vlan*
      - bridge*
      - bonding*
      - eoip*
      - gre*
      - wireguard*
      - pppoe*
      - vrrp*
    Juniper:
      physicalCandidates:
      - ge-*
      - xe-*
      - et-*
      - fxp0
      logical:
      - ge-*.*
      - xe-*.*
      - et-*.*
      - irb.*
      - lo0.*
      - ae*
      - reth*
      - st*
      - gr-*
      - ip-*
  rule: Names are only one signal. Use vendor, model, ifType, connector metadata, and template knowledge. UNKNOWN must not be auto-created on
    a vendor template.
