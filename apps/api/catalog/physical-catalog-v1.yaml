templates:
- catalogKey: huawei-ne8000-f1a-8h20q
  manufacturer: Huawei
  family: NetEngine 8000
  model: F1A-8H20Q
  aliases: []
  kind: ROUTER
  layoutType: FIXED
  heightU: 1
  rackMount: true
  # Painel frontal real: 56 conectores em UMA faixa contínua de 28 colunas x 2
  # fileiras, numerados de 0 a 55 (par em cima, ímpar embaixo).
  panelLayout: {type: FRONT, width: 118, height: 7}
  vendorVerified: true
  portGroups:
  - groupKey: sfpplus-10g
    count: 28
    # 14 colunas x 2 fileiras: mesmo espaçamento do painel, sem bandas separadas.
    visual: {row: 1, x: 2, y: 0.6, gapX: 0.6, pairing: EVEN_ODD}
    connector: SFP_PLUS
    role: SERVICE
    speeds:
    - 1G
    - 10G
    breakoutCapable: false
    panelNumberStart: 0
    physicalLabelPattern: 10GE-{n}
    notes: 'Posições físicas 0-27: 28 x SFP+ (10GE/GE). Numeração do painel começa em zero.'
  - groupKey: sfp28-25g-a
    count: 8
    visual: {row: 1, x: 55.4, y: 0.6, gapX: 0.6, pairing: EVEN_ODD}
    connector: SFP28
    role: SERVICE
    speeds:
    - 10G
    - 25G
    breakoutCapable: false
    panelNumberStart: 28
    physicalLabelPattern: 25GE-{n}
    notes: 'Posições físicas 28-35: 8 x SFP28 (25GE/10GE/GE). Grupo próprio porque a documentação Huawei diferencia a capacidade deste bloco do bloco 36-47.'
  - groupKey: sfp28-25g-b
    count: 12
    visual: {row: 1, x: 70.8, y: 0.6, gapX: 0.6, pairing: EVEN_ODD}
    connector: SFP28
    role: SERVICE
    speeds:
    - 10G
    - 25G
    breakoutCapable: false
    panelNumberStart: 36
    physicalLabelPattern: 25GE-{n}
    notes: 'Posições físicas 36-47: 12 x SFP28 (25GE/10GE).'
  - groupKey: qsfp28-100g
    count: 8
    visual: {row: 1, x: 93.8, y: 0.6, gapX: 0.6, pairing: EVEN_ODD}
    connector: QSFP28
    role: UPLINK
    speeds:
    - 40G
    - 50G
    - 100G
    breakoutCapable: true
    panelNumberStart: 48
    physicalLabelPattern: 100GE-{n}
    notes: 'Posições físicas 48-55: 8 x QSFP28 (100GE). Um cage continua sendo um conector sob breakout ou mudança de rate.'
