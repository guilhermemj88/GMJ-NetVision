implementationNotes:
- Port group physicalLabelPattern is a compact declaration. Importer/bootstrap may expand it into individual PhysicalTemplatePort rows.
- Patterns containing {n+5} are semantic offset patterns; importer should expand to the actual ordinals instead of treating them literally.
- Do not hardcode Huawei stack/member numbering into template connector identity. Keep a stable physical connector identity and let the Huawei
  driver map CLI names.
- Desktop/non-rack devices may use a 1U logical footprint in the current rack UI, but rackMount=false must be preserved.
- Do not silently change vendorVerified=false to true without an official source and a reviewed change to this catalog.
- 'V1.1 verification sweep: Huawei F1A, NetEngine 8000 chassis, NE40E chassis, S6750 missing variants, and most MikroTik fixed-hardware templates
  were reconciled against official manufacturer pages.'
- NE40E-X3 has separate DC (4U) and AC (5U) templates because the official Huawei specification gives different chassis heights for the same base
  model.
- MikroTik dedicated console and management connectors are represented separately when the official product page identifies them. Desktop devices
  keep a logical 1U height for the current rack UI but rackMount=false.
