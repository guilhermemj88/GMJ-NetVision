<title>Diagnóstico VSI NetVision</title>

<style>
/* Layout: veredito no topo; abaixo, problemas e topologia lado a lado no monitor de NOC, em coluna no notebook;
   depois equipamentos, proximos passos e evidencias recolhidas. Tema unico escuro: e a identidade do NetVision. */
:root {
  color-scheme: dark;
  --bg: #091016; --panel: #101920; --panel-2: #142029; --line: #263642; --line-soft: #1c2a33;
  --text: #dce8ee; --muted: #8497a3; --cyan: #45b7d9; --cyan-bright: #65cce7;
  --green: #43c59e; --amber: #d9a24b; --red: #d25e61; --violet: #a98bd6; --slate: #8a9fb0;
  --green-bg: rgba(67,197,158,.10); --amber-bg: rgba(217,162,75,.10); --red-bg: rgba(210,94,97,.11);
  --violet-bg: rgba(169,139,214,.10); --slate-bg: rgba(138,159,176,.09); --cyan-bg: rgba(69,183,217,.09);
  --font-sans: 'Inter', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --r: 8px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
code, pre, .mono { font-family: var(--font-mono); font-size: 12.5px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--cyan-bright); outline-offset: 2px; }
.wrap { max-width: 1720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* faixa de prototipo */
.demo { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; border: 1px dashed var(--amber);
  border-radius: var(--r); background: var(--amber-bg); font-size: 12.5px; }
.demo strong { letter-spacing: .06em; color: var(--amber); }

/* barra do modulo */
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.bar h1 { font-size: 18px; font-weight: 600; }
.bar h1 span { color: var(--muted); font-weight: 400; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 13px; }
.tab[aria-pressed="true"] { color: var(--text); border-color: var(--cyan); background: var(--cyan-bg); }

/* superficie base */
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel > h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.panel > h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }

/* veredito */
.verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; padding: 16px 18px; border-left: 4px solid var(--tone); background: var(--panel); border-radius: var(--r);
  border-top: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
.verdict .vsi { font-family: var(--font-mono); font-size: 15px; color: var(--cyan-bright); overflow-wrap: anywhere; }
.verdict .state { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 6px; }
.verdict .state b { font-size: 20px; font-weight: 700; color: var(--tone); letter-spacing: .01em; }
.verdict .say { font-size: 15px; max-width: 78ch; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
.count { border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12.5px; color: var(--muted); }
.count b { color: var(--text); font-weight: 600; }
.prov { display: flex; flex-direction: column; gap: 6px; min-width: 250px; }
.prov h3 { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.src { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; align-items: baseline; }
.src dt { color: var(--muted); } .src dd { margin: 0; }

/* selos */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--tone); color: var(--tone);
  background: var(--tone-bg); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge svg { width: 13px; height: 13px; flex: none; }
.t-ok { --tone: var(--green); --tone-bg: var(--green-bg); } .t-warn { --tone: var(--amber); --tone-bg: var(--amber-bg); }
.t-crit { --tone: var(--red); --tone-bg: var(--red-bg); } .t-unk { --tone: var(--violet); --tone-bg: var(--violet-bg); }
.t-standby { --tone: var(--slate); --tone-bg: var(--slate-bg); } .t-stale { --tone: var(--muted); --tone-bg: var(--slate-bg); }
.t-collect { --tone: var(--cyan); --tone-bg: var(--cyan-bg); }

.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1600px) { .grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }

/* achados */
.group + .group { margin-top: 14px; }
.group > h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--tone); margin-bottom: 6px; }
.group > h3 span { color: var(--muted); font-weight: 400; }
.issue { border: 1px solid var(--line-soft); border-left: 3px solid var(--tone); border-radius: 6px; background: var(--panel-2); }
.issue + .issue { margin-top: 6px; }
.issue summary { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 12px; cursor: pointer; align-items: start; }
.issue summary::-webkit-details-marker { display: none; }
.issue .what { font-weight: 500; }
.issue .where { grid-column: 2; color: var(--muted); font-size: 12.5px; }
.issue .chev { color: var(--muted); transition: transform .15s; } .issue[open] .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .issue .chev { transition: none; } }
.issue .body { padding: 2px 12px 12px 12px; display: grid; gap: 8px; font-size: 13.5px; }
.kv { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 4px 10px; }
.kv dt { color: var(--muted); font-size: 12.5px; } .kv dd { margin: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 4px; } }
.evlink { background: none; border: 0; padding: 0; color: var(--cyan-bright); text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; text-align: left; }
.evlinks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.quiet { color: var(--muted); font-size: 13px; }

/* topologia */
.topo { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg); }
.topo svg { display: block; min-width: 780px; width: 100%; height: auto; }
.topo text { font-family: var(--font-sans); fill: var(--text); font-size: 13.5px; }
.topo .m { fill: var(--muted); font-size: 12.5px; } .topo .mono { font-family: var(--font-mono); font-size: 12.5px; }
.topo .box { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.2; }
.topo .box.unread { fill: none; stroke: var(--muted); stroke-dasharray: 2 4; }
.topo .l-active { stroke: var(--green); stroke-width: 3.2; fill: none; }
.topo .l-standby { stroke: var(--slate); stroke-width: 2.2; stroke-dasharray: 9 6; fill: none; }
.topo .l-unread { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 2 5; fill: none; }
.topo .l-unk { stroke: var(--violet); stroke-width: 1.8; stroke-dasharray: 2 5; fill: none; }
.topo .l-ctl { stroke: var(--cyan); stroke-width: 1.4; fill: none; }
.topo .f-green { fill: var(--green); } .topo .f-slate { fill: var(--slate); } .topo .f-violet { fill: var(--violet); } .topo .f-cyan { fill: var(--cyan-bright); } .topo .f-amber { fill: var(--amber); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 34px; height: 0; border-top: 3px solid var(--green); }
.legend i.s { border-top: 2px dashed var(--slate); } .legend i.u { border-top: 2px dotted var(--muted); } .legend i.q { border-top: 2px dotted var(--violet); } .legend i.c { border-top: 1.5px solid var(--cyan); }

/* equipamentos */
.eps { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); align-items: start; }
.ep { border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--panel-2); min-width: 0; }
.ep summary { list-style: none; cursor: pointer; padding: 11px 14px; display: grid; gap: 6px; }
.ep summary::-webkit-details-marker { display: none; }
.ep .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.ep .name { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
.ep .line { display: flex; flex-wrap: wrap; gap: 5px 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; font-size: 12px; color: var(--muted); }
.chip b { font-weight: 600; color: var(--tone, var(--text)); } .chip svg { width: 11px; height: 11px; color: var(--tone, var(--muted)); }
.ep .body { border-top: 1px solid var(--line-soft); padding: 10px 14px 13px; display: grid; gap: 10px; }
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 4px 10px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
.row:last-child { border-bottom: 0; }
.row .k { color: var(--muted); font-size: 12.5px; } .row .v { min-width: 0; overflow-wrap: anywhere; }
.row .v small { display: block; color: var(--muted); font-size: 12.5px; }
.origin { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.origin.ssh { color: var(--green); border-color: rgba(67,197,158,.45); } .origin.snmp { color: var(--amber); border-color: rgba(217,162,75,.45); } .origin.none { color: var(--violet); border-color: rgba(169,139,214,.45); }
@media (max-width: 520px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .k { grid-column: 1 / -1; } }
.missing { border: 1px dashed var(--violet); border-radius: 6px; padding: 8px 10px; font-size: 13px; background: var(--violet-bg); }
.missing b { color: var(--violet); }

/* passos */
.steps { counter-reset: s; display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; padding: 9px 12px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel-2); }
.steps li::before { content: counter(s); grid-row: span 3; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--cyan); color: var(--cyan-bright); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.steps .why { color: var(--muted); font-size: 12.5px; }
.steps code { color: var(--cyan-bright); overflow-wrap: anywhere; }

/* evidencias */
.evs { display: grid; gap: 4px; }
.ev { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; width: 100%; text-align: left; padding: 7px 10px;
  border: 1px solid var(--line-soft); border-radius: 6px; background: var(--panel-2); }
.ev:hover { border-color: var(--cyan); }
.ev .h { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; } .ev .c { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; } .ev .a { color: var(--muted); font-size: 12px; white-space: nowrap; }
@media (max-width: 760px) { .ev { grid-template-columns: minmax(0, 1fr) auto; } .ev .h, .ev .c { grid-column: 1 / -1; } }
details.fold > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }
details.fold > summary::before { content: '▸'; } details.fold[open] > summary::before { content: '▾'; }
details.fold[open] > summary { margin-bottom: 10px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(2,6,12,.62); border: 0; z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(660px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; gap: 12px; justify-content: space-between; align-items: start; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
.drawer header .c { font-family: var(--font-mono); font-size: 13px; color: var(--cyan-bright); overflow-wrap: anywhere; }
.drawer .x { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; width: 30px; height: 30px; flex: none; }
.drawer .meta { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.drawer pre { margin: 0; padding: 14px 16px; overflow: auto; flex: 1; white-space: pre; background: var(--bg); color: var(--text); line-height: 1.45; }
.note { border-left: 3px solid var(--tone); background: var(--tone-bg); padding: 7px 10px; border-radius: 4px; font-size: 13px; margin-top: 8px; }

.mx-scroll { overflow-x: auto; }

function evLinks(s, ids) {
  return `<span class="evlinks">${ids.map((id) => { const e = s.evidence.find((x) => x.id === id); return `<button class="evlink" data-ev="${id}">${esc(e.cmd)} · ${e.host.replace(/-MPLS-0\d$/, '')}</button>`; }).join('')}</span>`;
}

function matrix(s) {
  let h = `<div class="mx-scroll"><div class="mx" style="--n:${s.endpoints.length}"><div class="mx-corner"></div>`;
  h += s.endpoints.map((e, c) => `<div class="mx-head" style="--o:${(c + 1) * 100}"><div class="name">${e.name}</div><div class="quiet">${e.sub}</div>
    <div class="line">${e.badges.map((b) => badge(...b)).join('')}</div></div>`).join('');
  LAYERS.forEach(([key, label], r) => {
    if (key === 'g') { h += `<div class="mx-group">${label}</div>`; return; }
    h += `<div class="mx-lab">${label}</div>`;
    s.endpoints.forEach((e, c) => {
      const o = (c + 1) * 100 + r + 1;
      if (key === 'missing') { h += `<div class="mx-cell miss" style="--o:${o}"><span class="lab">Falta ler</span>${e.missing}</div>`; return; }
      const [tone, icon, st, text, small, src, when, ev] = e.cells[key];
      h += `<div class="mx-cell t-${tone}" style="--o:${o}"><span class="lab">${label}</span>
        <div class="st"><span class="stv">${ico(icon)}${st}</span><span class="origin ${src}">${when}</span></div>
        <div>${text}</div>${small ? `<small>${small}</small>` : ''}${ev ? `<button class="evlink" data-ev="${ev}">ver evidência</button>` : ''}</div>`;
    });
  });
  return h + '</div></div>';
}

function render(id) {
  const s = S[id]; current = s; currentId = id;
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.s === id)));
  const groups = ORDER.map((c) => [c, s.issues.filter((i) => i.cat === c)]).filter(([, l]) => l.length);
  const problems = groups.filter(([c]) => c !== 'standby');
  const failures = s.issues.filter((i) => i.cat === 'crit').length;
  const stepOf = (i) => STEP[id][s.issues.indexOf(i)];
  document.getElementById('app').innerHTML = `
  <section class="verdict t-${s.verdict.tone}" aria-label="Veredito">
    <div>
      <div class="vsi">${s.vsi}</div>
      <div class="state">${ico(s.verdict.icon).replace('<svg', '<svg style="width:22px;height:22px;color:var(--tone)"')}<b>${s.verdict.label}</b>${s.fresh}
        ${failures === 0 ? '<span class="quiet">Nenhuma falha comprovada na evidência disponível.</span>' : ''}</div>
      <p class="say">${s.verdict.say}</p>
    </div>
    <div class="prov"><h3>Origem e idade</h3><dl class="src">${s.sources.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>
    <div class="axes">${s.axes.map(([t, i, k, v, d]) => `<div class="axis t-${t}"><div class="k">${k}</div><div class="v">${ico(i)}${v}</div><div class="d">${d}</div></div>`).join('')}</div>
  </section>

  <div class="grid two">
    <section class="panel" aria-label="Achados"><h2>Achados <small>${problems.reduce((n, [, l]) => n + l.length, 0)} pendência(s), por gravidade</small></h2>
      ${groups.map(([c, list]) => `<div class="group t-${CAT[c][0]}"><h3>${ico(CAT[c][1]).replace('<svg', '<svg style="width:15px;height:15px"')}${CAT[c][2]} <span>${list.length}</span></h3>
        ${list.map((i) => `<details class="issue"${c === 'crit' || c === 'unk' ? ' open' : ''}><summary><span>${ico(CAT[c][1]).replace('<svg', '<svg style="width:15px;height:15px;color:var(--tone);margin-top:4px"')}</span>
          <span class="what">${i.what}</span><span class="chev" aria-hidden="true">▸</span><span class="where">${i.host} · ${i.comp}</span></summary>
          <div class="body"><dl class="kv"><dt>O que foi detectado</dt><dd>${i.detected}</dd><dt>Por que importa</dt><dd>${i.why}</dd><dt>Grau de certeza</dt><dd>${i.certainty}</dd>
          <dt>Evidência</dt><dd>${evLinks(s, i.ev)}</dd><dt>Próximo teste</dt><dd>${stepOf(i) ? `<button class="evlink" data-step="${stepOf(i)}">Passo ${stepOf(i)} · ${i.next}</button>` : i.next}</dd></dl></div></details>`).join('')}</div>`).join('')}
    </section>
    <section class="panel" aria-label="Topologia"><h2>Topologia <small>${s.topoTitle}</small></h2>
      <div class="topo">${s.topo}</div>
      <div class="topo-hint">Deslize o diagrama para os lados. A comparação por equipamento logo abaixo traz os mesmos dados em formato de lista.</div>
      <div class="legend"><span><i></i>▲ ativo</span><span><i class="s"></i>⏸ standby esperado</span><span><i class="u"></i>? não lido</span><span><i class="q"></i>? indeterminado</span><span><i class="c"></i>relação E-Trunk</span></div>
    </section>
  </div>

  <section class="panel" aria-label="Comparação por equipamento"><h2>Por equipamento <small>${s.endpoints.length} PE(s) lado a lado · cada célula traz o estado, a origem e a hora da leitura</small></h2>
    ${matrix(s)}
  </section>

  <div class="grid two">
  <section class="panel" aria-label="Próximos passos"><h2>Próximos passos <small>verificações sugeridas, não causas comprovadas</small></h2>
    <ol class="steps">${s.steps.map((p, n) => `<li id="step-${n + 1}"><span>${p.text}</span>
      <span class="cmdline"><code>${esc(p.cmd)}</code><button class="copy" data-copy="${esc(p.cmd)}">copiar</button></span>
      <span class="why">Motivo: ${p.why} ${evLinks(s, [p.ev])}</span></li>`).join('')}</ol>
  </section>

  <section class="panel" aria-label="Evidências técnicas"><h2>Evidências técnicas <small>${s.evidence.length} itens · clique para ver a saída bruta</small></h2>
    <div class="evs">${s.evidence.map((e) => `<button class="ev" data-ev="${e.id}"><span class="h">${e.host}</span><span class="c">${esc(e.cmd)}</span><span class="a">${e.at}</span>
      <span class="origin ${e.incomplete ? 'none' : SRC[e.src][0]}">${e.incomplete ? 'incompleta' : SRC[e.src][1]}</span></button>`).join('')}</div>
  </section>
  </div>`;
}

function openEvidence(id) {
  const e = current.evidence.find((x) => x.id === id); if (!e) return;
  const hl = HL[id] || [];
  const body = e.out.split('\n').map((l) => `<span class="ln${hl.some((k) => l.includes(k)) ? ' hl' : ''}">${esc(l)}</span>`).join('');
  const isCmd = e.src === 'ssh';
  document.getElementById('drawer-root').innerHTML = `<button class="scrim" aria-label="Fechar evidência"></button>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Evidência">
    <header><div><div class="c">${esc(e.cmd)}</div><div class="quiet">${e.host}</div></div><button class="x" aria-label="Fechar" id="drawer-close">✕</button></header>
    <div class="meta"><dl class="kv"><dt>Origem</dt><dd><span class="origin ${SRC[e.src][0]}">${isCmd ? 'SSH · saída do equipamento' : 'SNMP · banco do NetVision'}</span></dd>
      <dt>Coletado em</dt><dd>${e.at}/2026</dd><dt>Completa</dt><dd>${e.incomplete ? 'não · descartada pelo diagnóstico' : 'sim'}</dd></dl>
      ${e.note ? `<div class="note t-${e.note[0]}">${e.note[1]}</div>` : ''}
      <div class="tools">${isCmd ? `<button class="copy" data-copy="${esc(e.cmd)}">copiar comando</button>` : ''}<button class="copy" data-copy-out="${id}">copiar saída</button>
        ${hl.length ? '<span class="quiet">Faixa azul: linhas usadas nesta tela.</span>' : ''}</div></div>
    <pre>${body}</pre></aside>`;
  document.getElementById('drawer-close').focus();
}
const closeEvidence = () => { document.getElementById('drawer-root').innerHTML = ''; };

async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'copiado'; }
  catch { btn.textContent = 'copie manualmente'; }
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-ev], [data-step], [data-copy], [data-copy-out], .tab, .scrim, #drawer-close'); if (!t) return;
  if (t.dataset.copy) { copyText(t, t.dataset.copy); }
  else if (t.dataset.copyOut) { copyText(t, current.evidence.find((x) => x.id === t.dataset.copyOut).out); }
  else if (t.dataset.step) { const li = document.getElementById('step-' + t.dataset.step); li.scrollIntoView({ block: 'center' }); li.classList.add('flash'); }
  else if (t.dataset.ev) { ev.preventDefault(); openEvidence(t.dataset.ev); }
  else if (t.classList.contains('tab')) { location.hash = t.dataset.s; }
  else closeEvidence();
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeEvidence(); });

function route() {
  const h = location.hash.replace('#', '');
  const id = Object.keys(S).find((k) => h.startsWith(k)) || 'vsi-3072';
  closeEvidence(); render(id);
  const ev = /-ev-(.+)$/.exec(h); if (ev) openEvidence(ev[1]);
}
