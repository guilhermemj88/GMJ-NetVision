# Terminador TLS dedicado ao canal n8n -> NetVision (NAO instalado automaticamente).
# Expoe SOMENTE o endpoint de comando do n8n; o resto da API continua so em loopback/painel.
# Certificado: autoassinado (CN = IP/hostname do servidor) ou de CA interna; o n8n valida o certificado (ou o fixa).
#   openssl req -x509 -newkey rsa:3072 -nodes -days 825 -keyout /etc/netvision/tls/n8n.key -out /etc/netvision/tls/n8n.crt \
#     -subj "/CN=45.163.144.8" -addext "subjectAltName=IP:45.163.144.8"; chmod 600 /etc/netvision/tls/n8n.key
# Firewall: com este terminador, N8N_PORT=8443 no netvision-firewall.sh e a :3333 fica so em loopback.
# NETVISION_N8N_ALLOWED_SOURCE_IPS passa a ver 127.0.0.1 (socket do nginx): usar `allow` aqui, nao la.
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate     /etc/netvision/tls/n8n.crt;
  ssl_certificate_key /etc/netvision/tls/n8n.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  allow 179.189.80.25;   # origem do n8n
  deny all;
  client_max_body_size 16k;
  location = /api/integrations/n8n/mitigation-command {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:3333;
    proxy_read_timeout 130s;   # > timeout do HTTP do n8n (120 s)
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location / { return 404; }
}
